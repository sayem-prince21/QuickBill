<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="qbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#qbGrad)" />
  
  <!-- POS Register terminal shape -->
  <rect x="96" y="110" width="320" height="230" rx="32" fill="url(#screenGrad)" stroke="#34d399" stroke-width="8" />
  
  <!-- Screen receipt slot -->
  <rect x="140" y="80" width="232" height="20" rx="6" fill="#f8fafc" />
  <!-- Emerging receipt paper -->
  <path d="M160 50 L352 50 L352 80 L160 80 Z" fill="#ffffff" />
  <line x1="180" y1="62" x2="280" y2="62" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <line x1="180" y1="70" x2="330" y2="70" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

  <!-- Screen Content: QB Logo & Currency Taka -->
  <text x="256" y="210" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="#34d399" text-anchor="middle">QB POS</text>
  <text x="256" y="270" font-family="system-ui, sans-serif" font-weight="700" font-size="34" fill="#f8fafc" text-anchor="middle">৳ 0.00 OFFLINE</text>
  
  <!-- Register Base / Keypad Area -->
  <path d="M64 340 L448 340 L416 430 L96 430 Z" fill="#1e293b" stroke="#334155" stroke-width="6" />
  
  <!-- Keypad dots / buttons -->
  <circle cx="160" cy="385" r="14" fill="#10b981" />
  <circle cx="210" cy="385" r="14" fill="#38bdf8" />
  <circle cx="260" cy="385" r="14" fill="#fbbf24" />
  <circle cx="310" cy="385" r="14" fill="#f43f5e" />
  <rect x="345" y="371" width="50" height="28" rx="8" fill="#10b981" />
</svg>
